name: run
on:
  schedule:
    - cron: '5,20 1-18 * * *'  # post: :35 and :50 IST, 06–23 IST; each channel's post_next.py decides if its slot is open
    - cron: '0 22 * * 0'    # refresh tokens weekly (Sunday 22:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [post, refresh]
        default: post
      force:
        description: post now even if the slot already has a post
        type: boolean
        default: false
      channel:
        description: only this channel number (blank = all)
        default: ''
permissions:
  actions: write  # keep-alive below
  contents: read
concurrency:
  group: runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Run channels
        env:
          RUNNER_CONFIG: ${{ secrets.RUNNER_CONFIG }}
          FORCE: ${{ inputs.force && '1' || '' }}
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode || (github.event.schedule == '0 22 * * 0' && 'refresh' || 'post') }}
        run: python3 runner.py "$MODE"
      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows after 60 days without commits; re-enabling resets that.
        if: always() && github.event.schedule == '0 22 * * 0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/run.yml/enable"
